name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  quality:
    strategy:
      matrix:
        rust: [stable, '1.85.0']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - if: matrix.rust == 'stable'
        run: cargo fmt --all --check
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo test --locked --no-default-features
      - run: cargo doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package --locked --allow-dirty
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit --deny warnings
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/acquire-upstream.sh
      - run: cargo test --release --locked --test whole_corpus -- --ignored
        env:
          ANTHOLOGY_DATA: artifacts/upstream/data
